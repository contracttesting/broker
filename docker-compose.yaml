services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 3s
      retries: 15

  broker:
    build: ./broker
    environment:
      DATABASE_URL: postgres://broker:broker@postgres:5432/broker?sslmode=disable
      BROKER_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
