name: CLA

on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CLA_ALLOWLIST: alefcastelo,dependabot[bot]
          CLA_SIGNATURE_PHRASE: I have read the CLA Document and I hereby sign the CLA
          CLA_RECHECK_KEYWORD: recheck
        with:
          script: |
            const cla = require('./.github/cla/cla.js')
            await cla({ github, context, core })
