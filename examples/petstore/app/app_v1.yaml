consumes:
  pets:
    rest:
      "/pets":
        get:
          responses:
            "200": Pets
        post:
          request: CreatePetRequest
          responses:
            "200": Pet
      "/pets/*":
        put:
          request: UpdatePetRequest
          responses:
            "200": Pet
        delete:
          responses:
            "200": Message

schemas:
  Pet:
    type: object
    properties:
      petId:
        anyOf:
          - type: number
          - type: string
          - type: integer
      name:
        type: string

  Pets:
    type: array
    items:
      "$ref": Pet

  CreatePetRequest:
    type: object
    properties:
      name:
        type: string
      userId:
        type: integer

  UpdatePetRequest:
    type: object
    properties:
      name:
        type: string

  Message:
    type: object
    properties:
      message:
        type: string
